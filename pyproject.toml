[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-suite-runtime"
version = "2026.9.4"
description = "Current CC-Suite Company Fleet Kernel source and reusable runtime components"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]==3.3.4", "cryptography==46.0.7", "fastapi==0.141.1", "httpx==0.28.1", "mcp>=1.0,<2"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["fleet_kernel*", "scripts", "mcp_servers*"]

[tool.setuptools.package-data]
fleet_kernel = ["ddl/*.sql", "release_files.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
